name: CI

on:
  # Test the repository's maintained branches and pull requests targeting them.
  push:
    branches:
      - "master"
      - "vibing"
      - "vibe-pui"
  pull_request:
    branches:
      - "master"
      - "vibing"
      - "vibe-pui"
  schedule:
    # Weekly tests use the latest workflow on the repository's default branch.
    - cron: "0 0 * * 0"

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Collect all platform results when one compatibility check fails.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10.15", "3.12.13"]

    steps:
      - uses: actions/checkout@v3

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      # The maintained action supports current micromamba shell initialization.
      # https://github.com/mamba-org/setup-micromamba#usage
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
              - defaults
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        # Login shells activate the environment initialized by setup-micromamba.
        shell: bash -el {0}
        run: |
          python -m pip install .
          micromamba list

      - name: Run tests
        # Login shells activate the environment initialized by setup-micromamba.
        shell: bash -el {0}
        run: |
          pytest -v --cov=qmhub --cov-report=xml --color=yes qmhub/tests/

      - name: CodeCov
        uses: codecov/codecov-action@v1
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
